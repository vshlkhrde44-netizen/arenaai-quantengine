[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-quantengine"
version = "1.0.0"
description = "Institutional-Grade Local-First Quant Research & Paper Trading Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary / Educational Institutional License" }
authors = [{ name = "Antigravity QuantEngine Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "duckdb>=0.10.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "cryptography>=42.0.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0"
]

[project.scripts]
quantengine = "apps.backend.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
